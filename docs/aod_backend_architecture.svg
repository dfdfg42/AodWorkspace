<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1560" font-family="'Segoe UI','Malgun Gothic',sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#111"/>
    </marker>
    <!-- server rack -->
    <g id="srv">
      <rect x="-33" y="-26" width="66" height="22" rx="4" fill="#111"/>
      <rect x="-33" y="4" width="66" height="22" rx="4" fill="#111"/>
      <circle cx="18" cy="-15" r="2.5" fill="#fff"/><circle cx="26" cy="-15" r="2.5" fill="#fff"/>
      <circle cx="18" cy="15" r="2.5" fill="#fff"/><circle cx="26" cy="15" r="2.5" fill="#fff"/>
    </g>
    <!-- service (table) -->
    <g id="svc">
      <rect x="-28" y="-28" width="56" height="56" rx="8" fill="#111"/>
      <line x1="-28" y1="-10" x2="28" y2="-10" stroke="#fff" stroke-width="4"/>
      <line x1="0" y1="-10" x2="0" y2="28" stroke="#fff" stroke-width="4"/>
      <line x1="-28" y1="9" x2="28" y2="9" stroke="#fff" stroke-width="4"/>
    </g>
    <!-- database cylinder -->
    <g id="db">
      <path d="M-32,-24 v48 a32,10 0 0 0 64 0 v-48" fill="#111"/>
      <ellipse cx="0" cy="-24" rx="32" ry="10" fill="#111"/>
      <path d="M-32,-6 a32,10 0 0 0 64 0" fill="none" stroke="#fff" stroke-width="2.5"/>
      <path d="M-32,12 a32,10 0 0 0 64 0" fill="none" stroke="#fff" stroke-width="2.5"/>
    </g>
    <!-- queue (envelope + tag) -->
    <g id="q">
      <rect x="-42" y="-16" width="52" height="32" rx="3" fill="#fff" stroke="#111" stroke-width="3.5"/>
      <path d="M-42,-16 L-16,2 L10,-16" fill="none" stroke="#111" stroke-width="3.5"/>
      <path d="M16,-16 h14 l16,16 l-16,16 h-14 z" fill="#fff" stroke="#111" stroke-width="3.5"/>
    </g>
    <!-- cloud -->
    <g id="cloud">
      <circle cx="-20" cy="-6" r="20" fill="#111"/>
      <circle cx="6" cy="-14" r="24" fill="#111"/>
      <circle cx="26" cy="-2" r="17" fill="#111"/>
      <rect x="-38" y="-6" width="82" height="24" rx="12" fill="#111"/>
    </g>
    <!-- DNS globe -->
    <g id="globe">
      <circle r="26" fill="#fff" stroke="#111" stroke-width="4"/>
      <ellipse rx="11" ry="26" fill="none" stroke="#111" stroke-width="3"/>
      <line x1="-26" y1="0" x2="26" y2="0" stroke="#111" stroke-width="3"/>
      <path d="M-22,-13 a30,30 0 0 0 44,0 M-22,13 a30,30 0 0 1 44,0" fill="none" stroke="#111" stroke-width="3"/>
    </g>
    <!-- devices -->
    <g id="dev">
      <rect x="-50" y="-26" width="66" height="44" rx="5" fill="#fff" stroke="#111" stroke-width="5"/>
      <line x1="-58" y1="26" x2="24" y2="26" stroke="#111" stroke-width="5" stroke-linecap="round"/>
      <rect x="24" y="-18" width="28" height="48" rx="6" fill="#fff" stroke="#111" stroke-width="5"/>
      <line x1="32" y1="22" x2="44" y2="22" stroke="#111" stroke-width="3"/>
    </g>
    <style>
      .lt{font-size:30px;font-weight:700;fill:#111}
      .ls{font-size:18px;fill:#555}
      .n{font-size:21px;font-weight:700;fill:#111}
      .s{font-size:17px;fill:#333}
      .a{font-size:16px;fill:#444}
      .al{font-size:15.5px;fill:#333;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
      .cap{font-size:16px;fill:#999}
      .note{font-size:14px;fill:#888}
      .ln{stroke:#111;stroke-width:2;fill:none;marker-end:url(#ah)}
      .lnd{stroke:#111;stroke-width:2;fill:none;marker-end:url(#ah);stroke-dasharray:6 5}
      .layer{fill:none;stroke:#555;stroke-width:1.5;stroke-dasharray:8 6}
      .inner{fill:none;stroke:#777;stroke-width:1.5;stroke-dasharray:6 5}
      text{text-anchor:middle}
      .L{text-anchor:start}.R{text-anchor:end}
    </style>
  </defs>

  <rect width="2400" height="1560" fill="#ffffff"/>

  <!-- ═══════════ External Platform Layer ═══════════ -->
  <rect class="layer" x="40" y="30" width="880" height="390"/>
  <text class="lt" x="480" y="74">External Platform Layer</text>

  <use href="#cloud" x="260" y="150"/>
  <text class="n" x="260" y="202">TMDB API</text>
  <text class="s" x="260" y="226">&lt;&lt;WebClient · REST&gt;&gt;</text>
  <text class="a" x="260" y="250">영화 · TV 메타데이터 — 5건/5초</text>

  <use href="#cloud" x="700" y="150"/>
  <text class="n" x="700" y="202">Steam Store API</text>
  <text class="s" x="700" y="226">&lt;&lt;WebClient · REST&gt;&gt;</text>
  <text class="a" x="700" y="250">게임 메타데이터 — 5건/5초</text>

  <use href="#cloud" x="260" y="300"/>
  <text class="n" x="260" y="352">네이버웹툰</text>
  <text class="s" x="260" y="376">&lt;&lt;Selenium 4&gt;&gt;</text>
  <text class="a" x="260" y="400">동적 렌더링 크롤링 — 1건/5초</text>

  <use href="#cloud" x="700" y="300"/>
  <text class="n" x="700" y="352">네이버시리즈 · 카카오페이지</text>
  <text class="s" x="700" y="376">&lt;&lt;Jsoup&gt;&gt;</text>
  <text class="a" x="700" y="400">웹소설 정적 크롤링 — 33건/5초</text>

  <!-- ═══════════ Crawling Pipeline Layer ═══════════ -->
  <rect class="layer" x="40" y="470" width="880" height="1010"/>
  <text class="lt" x="480" y="514">Crawling Pipeline Layer</text>
  <text class="ls" x="480" y="540">(Crawler Server 내부 — Job Queue &amp; Ingest)</text>

  <use href="#svc" x="230" y="610"/>
  <text class="n" x="230" y="662">Producer</text>
  <text class="a" x="230" y="686">크롤 대상 수집 → 즉시 반환 (5초 내)</text>

  <use href="#q" x="230" y="780"/>
  <text class="n" x="230" y="830">crawl_job Job Queue</text>
  <text class="s" x="230" y="854">&lt;&lt;PostgreSQL · SKIP LOCKED&gt;&gt;</text>
  <text class="a" x="230" y="878">PENDING → PROCESSING → COMPLETED/FAILED</text>

  <use href="#svc" x="230" y="960"/>
  <text class="n" x="230" y="1012">Consumer</text>
  <text class="s" x="230" y="1036">&lt;&lt;@Scheduled fixedDelay=10s&gt;&gt;</text>
  <text class="a" x="230" y="1060">배치 사이즈 정책별 처리</text>

  <use href="#srv" x="700" y="960"/>
  <text class="n" x="700" y="1012">JobExecutor ×N</text>
  <text class="s" x="700" y="1036">&lt;&lt;Strategy Pattern&gt;&gt;</text>
  <text class="a" x="700" y="1060">새 플랫폼 = 구현체 추가로 자동 등록</text>

  <use href="#db" x="700" y="1110"/>
  <text class="n" x="700" y="1162">raw_item Staging</text>
  <text class="a" x="700" y="1186">크롤 원본 payload (JSONB)</text>

  <!-- Ingest inner box -->
  <rect class="inner" x="80" y="1220" width="800" height="240"/>
  <text class="n" x="340" y="1258" font-size="22">Ingest Pipeline (Transform Engine)</text>

  <use href="#svc" x="250" y="1330"/>
  <text class="n" x="250" y="1382">RuleRegistry</text>
  <text class="s" x="250" y="1404">&lt;&lt;YAML Rules v4&gt;&gt;</text>
  <text class="a" x="250" y="1426">기동 시 rules/**.yml 전수 검증 · 오타 = 부팅 실패</text>

  <use href="#svc" x="640" y="1330"/>
  <text class="n" x="640" y="1382">DraftAssembler</text>
  <text class="a" x="640" y="1404">master.* / domain.* / platform.* / attr.* 조립</text>
  <text class="a" x="640" y="1426">item별 트랜잭션 · TransformRun 감사 기록</text>

  <!-- left-column arrows -->
  <line class="ln" x1="230" y1="696" x2="230" y2="758"/>
  <text class="al L" x="244" y="732">Bulk INSERT (PENDING)</text>

  <line class="ln" x1="230" y1="886" x2="230" y2="926"/>
  <text class="al L" x="244" y="912">FOR UPDATE SKIP LOCKED claim</text>

  <line class="ln" x1="262" y1="960" x2="661" y2="960"/>
  <text class="al" x="460" y="948">작업 위임</text>

  <line class="ln" x1="700" y1="928" x2="700" y2="426"/>
  <text class="al L" x="714" y="690">크롤링 / API 호출</text>

  <path class="ln" d="M735,972 H880 V1110 H740"/>
  <text class="al R" x="868" y="1092">원본 저장</text>

  <line class="ln" x1="700" y1="1198" x2="648" y2="1298"/>
  <text class="al L" x="680" y="1250">RawItem JSON</text>

  <line class="lnd" x1="282" y1="1330" x2="606" y2="1330"/>
  <text class="al" x="444" y="1318">매핑 룰</text>

  <!-- ingest → PostgreSQL corridor -->
  <path class="ln" d="M676,1330 H910 V1237 H1600 V1150"/>
  <text class="al" x="1240" y="1225">Content + Domain + PlatformData 병합 저장 (UPSERT)</text>

  <!-- ═══════════ Client Layer ═══════════ -->
  <rect class="layer" x="980" y="30" width="1380" height="180"/>
  <text class="lt" x="1670" y="74">Client Layer</text>

  <use href="#dev" x="1250" y="125"/>
  <text class="n" x="1250" y="192">User Devices (Web Browser)</text>

  <use href="#globe" x="2150" y="125"/>
  <text class="n" x="2150" y="192">DNS</text>
  <line class="ln" x1="2120" y1="125" x2="1310" y2="125"/>

  <!-- ═══════════ Vercel Hosting & Proxy Layer ═══════════ -->
  <rect class="layer" x="980" y="250" width="1380" height="210"/>
  <text class="lt" x="1670" y="294">Frontend Hosting &amp; API Proxy Layer</text>
  <text class="ls" x="1670" y="320">&lt;&lt;Vercel&gt;&gt;</text>

  <use href="#cloud" x="1250" y="365"/>
  <text class="n" x="1250" y="417">Vercel Edge Network</text>
  <text class="a" x="1250" y="441">React SPA 정적 서빙 · CDN</text>

  <use href="#srv" x="1950" y="365"/>
  <text class="n" x="1950" y="417">Serverless Function Proxy</text>
  <text class="a" x="1950" y="441">api/[...path].ts → 백엔드 프록시 (프로덕션)</text>

  <line class="ln" x1="1250" y1="202" x2="1250" y2="322"/>
  <text class="al L" x="1264" y="268">HTTPS</text>

  <line class="ln" x1="1300" y1="365" x2="1908" y2="365"/>
  <text class="al" x="1600" y="353">/api/* 요청 라우팅</text>

  <!-- ═══════════ Web Application Server Layer ═══════════ -->
  <rect class="layer" x="980" y="510" width="1380" height="270"/>
  <text class="lt" x="1670" y="554">Web Application Server Layer</text>
  <text class="note R" x="2350" y="548">CI/CD: GitHub Actions → ECR → EC2 배포</text>

  <use href="#srv" x="1250" y="640"/>
  <text class="n" x="1250" y="694">Crawler Server</text>
  <text class="s" x="1250" y="718">&lt;&lt;Spring Boot&gt;&gt; :8081</text>
  <text class="a" x="1250" y="742">EC2 #2 · Docker + tini (좀비 프로세스 reap)</text>
  <text class="a" x="1250" y="764">Selenium Chrome ThreadLocal 재사용 (≤30회)</text>

  <use href="#srv" x="1950" y="640"/>
  <text class="n" x="1950" y="694">API Server</text>
  <text class="s" x="1950" y="718">&lt;&lt;Spring Boot&gt;&gt; :8080</text>
  <text class="a" x="1950" y="742">EC2 #1 · Docker · JWT 인증</text>
  <text class="a" x="1950" y="764">HikariCP max 5 · Tomcat threads 20</text>

  <line class="ln" x1="1950" y1="448" x2="1950" y2="608"/>
  <text class="al L" x="1964" y="534">HTTP :8080</text>

  <line class="ln" x1="1213" y1="640" x2="926" y2="640"/>
  <text class="al" x="1070" y="628">파이프라인 구동</text>

  <!-- ═══════════ Service & DB Layer ═══════════ -->
  <rect class="layer" x="980" y="810" width="1380" height="390"/>
  <text class="lt L" x="1010" y="854">Service &amp; DB Layer</text>

  <use href="#svc" x="1150" y="910"/>
  <text class="n" x="1150" y="962">Work · Search Service</text>
  <text class="a" x="1150" y="986">탐색 · 검색 · 장르 필터</text>

  <use href="#svc" x="1450" y="910"/>
  <text class="n" x="1450" y="962">Ranking Service</text>
  <text class="a" x="1450" y="986">외부 · 내부 랭킹 집계</text>

  <use href="#svc" x="1750" y="910"/>
  <text class="n" x="1750" y="962">Review · Bookmark Service</text>
  <text class="a" x="1750" y="986">리뷰 · 북마크 · 좋아요</text>

  <use href="#svc" x="2050" y="910"/>
  <text class="n" x="2050" y="962">User · Auth Service</text>
  <text class="a" x="2050" y="986">&lt;&lt;JWT&gt;&gt; 회원 · 인증</text>

  <use href="#db" x="1600" y="1105"/>
  <text class="n R" x="1540" y="1100">PostgreSQL</text>
  <text class="s R" x="1540" y="1124">&lt;&lt;AWS RDS&gt;&gt;</text>
  <text class="a L" x="1680" y="1082">contents(마스터) · 도메인 테이블 5종 (@MapsId + Persistable)</text>
  <text class="a L" x="1680" y="1106">platform_data (JSONB attributes) · users · reviews · bookmarks</text>
  <text class="a L" x="1680" y="1130">raw_item · crawl_job 도 동일 인스턴스 내 테이블</text>
  <text class="a L" x="1680" y="1154">GIN Index + @&gt; 연산자 · Slice 페이징</text>

  <text class="note" x="1180" y="1120">shared 모듈: JPA 엔티티 · 리포지토리</text>
  <text class="note" x="1180" y="1144">(api · crawler 공용 라이브러리)</text>

  <!-- API → services fan -->
  <line class="ln" x1="1950" y1="776" x2="1160" y2="876"/>
  <line class="ln" x1="1950" y1="776" x2="1456" y2="876"/>
  <line class="ln" x1="1950" y1="776" x2="1756" y2="876"/>
  <line class="ln" x1="1950" y1="776" x2="2050" y2="876"/>

  <!-- services → DB fan -->
  <line class="ln" x1="1150" y1="996" x2="1556" y2="1066"/>
  <line class="ln" x1="1450" y1="996" x2="1584" y2="1062"/>
  <line class="ln" x1="1750" y1="996" x2="1618" y2="1062"/>
  <line class="ln" x1="2050" y1="996" x2="1646" y2="1066"/>

  <!-- ═══════════ Monitoring Layer ═══════════ -->
  <rect class="layer" x="980" y="1250" width="1380" height="230"/>
  <text class="lt" x="1670" y="1294">Monitoring &amp; Observability Layer</text>

  <use href="#svc" x="1150" y="1350"/>
  <text class="n" x="1150" y="1402">Grafana</text>
  <text class="a" x="1150" y="1426">AOD Overview 대시보드</text>

  <use href="#srv" x="1440" y="1350"/>
  <text class="n" x="1440" y="1402">Prometheus</text>
  <text class="a" x="1440" y="1426">HTTP pull: /actuator/prometheus</text>
  <text class="a" x="1440" y="1448">(job = api · crawler)</text>

  <use href="#q" x="1730" y="1350"/>
  <text class="n" x="1730" y="1402">Alertmanager</text>
  <text class="a" x="1730" y="1426">알람 라우팅</text>

  <use href="#srv" x="2000" y="1350"/>
  <text class="n" x="2000" y="1402">Loki + Promtail</text>
  <text class="a" x="2000" y="1426">crawler 로그 push 수집</text>

  <use href="#cloud" x="2260" y="1350"/>
  <text class="n" x="2260" y="1402">Sentry</text>
  <text class="a" x="2260" y="1426">api · crawler 에러 트래킹 (SaaS)</text>

  <line class="ln" x1="1404" y1="1350" x2="1184" y2="1350"/>
  <text class="al" x="1294" y="1338">대시보드</text>
  <line class="ln" x1="1476" y1="1350" x2="1680" y2="1350"/>
  <text class="al" x="1580" y="1338">알람</text>

  <!-- caption -->
  <text class="cap" x="1200" y="1530">AOD (All of Dopamine) · Backend Architecture — AI 모듈 제외</text>
</svg>
