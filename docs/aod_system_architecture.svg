  <text class="st" x="375" y="842">&lt;&lt;api · crawler 관측&gt;&gt;</text>
  <rect class="chip" x="250" y="862" width="250" height="48" rx="10"/>
  <text class="ct" x="375" y="892">Prometheus · Grafana</text>
  <rect class="chip" x="250" y="920" width="250" height="48" rx="10"/>
  <text class="ct" x="375" y="950">Loki 로그</text>
  <rect class="chip" x="250" y="978" width="250" height="44" rx="10"/>
  <text class="ct" x="375" y="1006">Sentry 에러 추적</text>

  <!-- 클라우드 서비스 -->
  <rect class="box" x="225" y="1080" width="1480" height="70" rx="14"/>
  <text class="bt" x="965" y="1107">클라우드 서비스</text>
  <text class="st" x="965" y="1132">&lt;&lt;Amazon Web Services (EC2 · RDS) · Vercel&gt;&gt;</text>

  <!-- ── 화살표 ── -->
  <line class="ln" x1="108" y1="560" x2="219" y2="560"/>
  <line class="ln" x1="525" y1="520" x2="604" y2="480"/>
  <line class="ln" x1="525" y1="610" x2="604" y2="750"/>
  <line class="ln" x1="930" y1="490" x2="1004" y2="490"/>
  <line class="ln" x1="1170" y1="600" x2="1170" y2="674"/>
  <line class="ln" x1="780" y1="604" x2="1050" y2="674"/>
  <line class="ln" x1="1330" y1="795" x2="1394" y2="795"/>

  <line class="ln" x1="1560" y1="376" x2="1470" y2="264"/>
  <text class="al R" x="1440" y="335">주기적 크롤링 / API 호출</text>

  <line class="ln" x1="1560" y1="630" x2="1560" y2="674"/>
  <text class="al R" x="1548" y="658">변환 · 병합 저장</text>

  <!-- caption -->
  <text class="cap" x="900" y="1222">AOD (All of Dopamine) · System Architecture — AI 모듈 제외</text>
</svg>
