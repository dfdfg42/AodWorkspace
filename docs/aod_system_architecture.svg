  <text class="st" x="1560" y="742">&lt;&lt;PostgreSQL · AWS RDS&gt;&gt;</text>
  <rect class="chip" x="1425" y="762" width="270" height="48" rx="10"/>
  <text class="ct" x="1560" y="792">콘텐츠 마스터 · 도메인 상세</text>
  <rect class="chip" x="1425" y="820" width="270" height="48" rx="10"/>
  <text class="ct" x="1560" y="850">플랫폼 데이터 (JSONB)</text>
  <rect class="chip" x="1425" y="878" width="270" height="48" rx="10"/>
  <text class="ct" x="1560" y="908">크롤링 원본 (raw_item)</text>

  <!-- 운영 · 모니터링 -->
  <rect class="box" x="225" y="780" width="300" height="250" rx="18"/>
