  <rect class="chip" x="635" y="440" width="270" height="48" rx="10"/>
  <text class="ct" x="770" y="470">도메인 · 장르 · 플랫폼 필터</text>
  <rect class="chip" x="635" y="500" width="128" height="48" rx="10"/>
  <text class="ct" x="699" y="530">외부 랭킹</text>
  <rect class="chip" x="777" y="500" width="128" height="48" rx="10"/>
