<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1240" font-family="'Segoe UI','Malgun Gothic',sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#111"/>
    </marker>
    <g id="person">
      <circle cx="0" cy="-22" r="13" fill="none" stroke="#111" stroke-width="4"/>
      <path d="M-20,24 a20,20 0 0 1 40,0" fill="none" stroke="#111" stroke-width="4"/>
    </g>
    <style>
      .bt{font-size:20px;font-weight:700;fill:#111}
      .st{font-size:15px;fill:#333}
      .ct{font-size:15.5px;fill:#111}
      .cap{font-size:16px;fill:#999}
      .box{fill:#fff;stroke:#111;stroke-width:2.5}
      .chip{fill:#fff;stroke:#111;stroke-width:2}
      .band{fill:none;stroke:#777;stroke-width:1.5;stroke-dasharray:7 5}
      .frame{fill:none;stroke:#999;stroke-width:1.5}
      .ln{stroke:#111;stroke-width:1.8;fill:none;marker-end:url(#ah)}
      .al{font-size:14.5px;fill:#333;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
      text{text-anchor:middle}
      .L{text-anchor:start}.R{text-anchor:end}
    </style>
  </defs>

  <rect width="1800" height="1240" fill="#ffffff"/>

  <!-- 사용자 column -->
  <rect class="frame" x="30" y="30" width="110" height="1180"/>
  <use href="#person" x="85" y="555"/>
  <text class="bt" x="85" y="625" font-size="18">사용자</text>

  <!-- main frame -->
  <rect class="frame" x="160" y="30" width="1610" height="1180"/>

  <!-- ── 상단: 외부 서비스 밴드 ── -->
  <rect class="band" x="185" y="55" width="1560" height="250"/>
  <rect class="box" x="800" y="80" width="760" height="180" rx="18"/>
  <text class="bt" x="1180" y="118">외부 콘텐츠 플랫폼</text>

  <rect class="chip" x="830" y="140" width="130" height="70" rx="10"/>
  <text class="ct" x="895" y="170">TMDB</text>
  <text class="st" x="895" y="192">&lt;&lt;REST API&gt;&gt;</text>

  <rect class="chip" x="972" y="140" width="130" height="70" rx="10"/>
  <text class="ct" x="1037" y="170">Steam</text>
  <text class="st" x="1037" y="192">&lt;&lt;REST API&gt;&gt;</text>

  <rect class="chip" x="1114" y="140" width="130" height="70" rx="10"/>
  <text class="ct" x="1179" y="170">네이버웹툰</text>
  <text class="st" x="1179" y="192">&lt;&lt;Selenium&gt;&gt;</text>

  <rect class="chip" x="1256" y="140" width="130" height="70" rx="10"/>
  <text class="ct" x="1321" y="170">네이버시리즈</text>
  <text class="st" x="1321" y="192">&lt;&lt;Jsoup&gt;&gt;</text>

  <rect class="chip" x="1398" y="140" width="130" height="70" rx="10"/>
  <text class="ct" x="1463" y="170">카카오페이지</text>
  <text class="st" x="1463" y="192">&lt;&lt;Jsoup&gt;&gt;</text>

  <!-- ── 메인 서비스 밴드 ── -->
  <rect class="band" x="185" y="330" width="1560" height="850"/>

  <!-- 홈 대시보드 -->
  <rect class="box" x="225" y="450" width="300" height="250" rx="18"/>
  <text class="bt" x="375" y="490">홈 대시보드</text>
  <rect class="chip" x="250" y="510" width="250" height="48" rx="10"/>
