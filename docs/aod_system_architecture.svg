  <rect class="chip" x="1035" y="440" width="270" height="48" rx="10"/>
  <text class="ct" x="1170" y="470">플랫폼별 제공처</text>
  <rect class="chip" x="1035" y="500" width="128" height="48" rx="10"/>
  <text class="ct" x="1099" y="530">리뷰 · 평점</text>
  <rect class="chip" x="1177" y="500" width="128" height="48" rx="10"/>
  <text class="ct" x="1241" y="530">좋아요 · 북마크</text>

  <!-- 회원 · 프로필 -->
  <rect class="box" x="610" y="680" width="320" height="230" rx="18"/>
