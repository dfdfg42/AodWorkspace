  <text class="st" x="770" y="742">&lt;&lt;JWT 인증&gt;&gt;</text>
  <rect class="chip" x="635" y="762" width="270" height="48" rx="10"/>
  <text class="ct" x="770" y="792">로그인 · 회원가입 · 온보딩</text>
  <rect class="chip" x="635" y="820" width="270" height="48" rx="10"/>
  <text class="ct" x="770" y="850">내 리뷰 · 북마크 · 좋아요</text>

  <!-- 콘텐츠 카탈로그 -->
  <rect class="box" x="1010" y="680" width="320" height="230" rx="18"/>
  <text class="bt" x="1170" y="722">콘텐츠 카탈로그</text>
  <rect class="chip" x="1035" y="750" width="80" height="44" rx="10"/>
  <text class="ct" x="1075" y="778">영화</text>
  <rect class="chip" x="1125" y="750" width="80" height="44" rx="10"/>
  <text class="ct" x="1165" y="778">TV</text>
  <rect class="chip" x="1215" y="750" width="80" height="44" rx="10"/>
  <text class="ct" x="1255" y="778">게임</text>
  <rect class="chip" x="1035" y="806" width="128" height="44" rx="10"/>
  <text class="ct" x="1099" y="834">웹툰</text>
  <rect class="chip" x="1177" y="806" width="128" height="44" rx="10"/>
